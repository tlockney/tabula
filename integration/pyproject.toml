[project]
name = "tabula-integration"
version = "0.1.0"
description = "Tabula Home Assistant custom integration and its test suite"
# homeassistant 2026.2.3 (ADR 0001 item 8) needs at least this Python.
requires-python = ">=3.13.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.2.3",
  "pytest-homeassistant-custom-component==0.13.316",
  # tts and its ffmpeg dependency, for the tts.speak tests (P1.4); pins match
  # the tts and ffmpeg manifests of homeassistant 2026.2.3.
  "ha-ffmpeg==3.2.2",
  "mutagen==1.47.0",
  # The assist satellite platform (P7.3) imports HA's conversation and audio
  # pipeline code. These four are homeassistant dependencies that the wheel
  # does not declare (they are in HA's requirements.txt, taken from its
  # package_constraints.txt); the pins below are that file's at 2026.2.3, and
  # tools/ha_matrix.sh reads each leg's own.
  "hassil==3.5.0",
  "home-assistant-intents==2026.1.28",
  "pymicro-vad==1.0.1",
  "pyspeex-noise==1.0.2",
  "tabula-mockdevice",
]

[tool.uv]
package = false
