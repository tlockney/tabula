name: Bug
description: Something behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version, integration version, HA version, device
