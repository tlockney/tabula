name: labels

on:
  push:
    branches: [main]
    paths: [.github/labels.txt, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          grep -v '^#' .github/labels.txt | grep -v '^$' | while IFS='|' read -r name color desc; do
            gh label create "$name" --color "$color" --description "$desc" --force
          done
